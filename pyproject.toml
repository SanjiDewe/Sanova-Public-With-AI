[project]
name = 'sanova-physical-touch'
version = '0.1.1'
requires-python = '>=3.11'
dependencies = ['fastapi>=0.115,<1', 'uvicorn[standard]>=0.30,<1', 'jinja2>=3.1,<4', 'python-multipart>=0.0.9,<1', 'psycopg[binary]>=3.2,<4', 'cryptography>=43,<47']

[project.optional-dependencies]
test = ['pytest>=8']

[tool.pytest.ini_options]
pythonpath = ['.']
testpaths = ['tests']

[tool.setuptools.packages.find]
include = ["app*"]
