{% extends 'base.html' %}
{% block title %}Super Admin · Sanova{% endblock %}
{% block content %}
<section class="app-pagebar"><div class="app-pagebar-title"><p class="eyebrow">Super Admin</p><h1>Privileged access</h1><p>Enter the Super Admin access code to continue.</p></div></section>

{% endblock %}
