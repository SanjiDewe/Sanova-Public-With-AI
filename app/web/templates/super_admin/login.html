{% extends 'base.html' %}
{% block title %}Super Admin Login · Sanova{% endblock %}
{% block content %}
<section class="app-pagebar"><div class="app-pagebar-title"><p class="eyebrow">Super Admin</p><h1>Log In</h1><p>Sign in with your existing Sanova account to continue.</p></div></section>
<div class="card" style="max-width:560px;margin:0 auto"><form method="post" action="/super-admin/login">{% if error %}<p class="danger-text" role="alert">{{ error }}</p>{% endif %}<label>Email<input type="email" name="email" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button type="submit">Log In</button></form></div>
{% endblock %}
