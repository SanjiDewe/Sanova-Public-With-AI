build:
  system: docker

dockerfile_path: "./Dockerfile"

working_directory: "/"
build_context_directory: "/"

start_command: "uvicorn app.web.main:app --host 0.0.0.0 --port $PORT"

scaling:
  min_replicas: 1
  max_replicas: 1

health_check:
  type: http
  http_path: "/health"
  interval_in_seconds: 30
